{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-12">
    <div class="text-center mb-10">
        <h1 class="text-3xl md:text-5xl font-bold text-gray-900 mb-6">Наші послуги</h1>
        
        <!-- Пошук послуг -->
        <form method="GET" action="{{ url_for('shop.services') }}" class="max-w-md mx-auto flex gap-2">
            <input type="text" name="q" value="{{ search_query }}" placeholder="Пошук послуги..." 
                   class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none">
            <button type="submit" class="bg-teal-600 text-white font-semibold px-6 py-2 rounded-xl hover:bg-teal-700 transition">
                Знайти
            </button>
        </form>
    </div>

    <!-- Сітка карток послуг із Tailwind -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        {% for service in services %}
        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
            <div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">{{ service['title'] }}</h3>
                <p class="text-gray-600 mb-4 text-sm">{{ service['description'] }}</p>
            </div>
            <div>
                <div class="text-xl font-bold text-teal-700 mb-4">{{ service['price'] }} ₴</div>
                <form action="{{ url_for('shop.make_order', product_id=service['id']) }}" method="POST">
                    <button type="submit" class="w-full bg-teal-600 text-white font-semibold py-2.5 px-4 rounded-xl hover:bg-teal-700 transition">
                        Замовити
                    </button>
                </form>
            </div>
        </div>
        {% else %}
        <p class="text-gray-500 col-span-3 text-center py-8">За вашим запитом нічого не знайдено.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
