{% extends "base.html" %}

{% block content %}
<div class="py-4 sm:py-6 space-y-12">
    <div class="text-center max-w-2xl mx-auto">
        <span class="inline-flex items-center gap-2 bg-rose-100/90 text-rose-700 border border-rose-200 text-xs font-semibold uppercase tracking-wider px-4 py-1.5 rounded-full mb-4">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span>
            Каталог пропозицій
        </span>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-stone-900 mb-6">Наші послуги</h1>
        
        <!-- Пошук послуг -->
        <form method="GET" action="{{ url_for('shop.services') }}" class="max-w-md mx-auto flex flex-col sm:flex-row gap-2.5">
            <input type="text" name="q" value="{{ search_query }}" placeholder="Пошук послуги..." 
                   class="w-full px-4 py-2.5 bg-white border border-rose-200 rounded-full text-stone-800 placeholder:text-stone-400 focus:ring-2 focus:ring-rose-300 focus:border-rose-400 focus:outline-none transition">
            <button type="submit" class="bg-rose-500 text-white font-semibold px-6 py-2.5 rounded-full shadow-sm shadow-rose-200/80 hover:bg-rose-600 transition shrink-0">
                Знайти
            </button>
        </form>
    </div>

    <!-- Сітка карток послуг із Tailwind -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
        {% for service in services %}
        <div class="bg-rose-50/40 p-7 sm:p-8 rounded-[1.75rem] border border-rose-100 shadow-xs flex flex-col justify-between transition duration-200 hover:-translate-y-1 hover:shadow-md hover:bg-white">
            <div>
                <h3 class="text-xl font-bold text-stone-900 mb-2.5">{{ service['title'] }}</h3>
                <p class="text-stone-600 mb-6 text-sm leading-relaxed">{{ service['description'] }}</p>
            </div>
            <div class="pt-4 border-t border-rose-100/90">
                <div class="text-2xl font-bold text-rose-600 mb-4">{{ service['price'] }} ₴</div>
                <form action="{{ url_for('shop.make_order', product_id=service['id']) }}" method="POST">
                    <button type="submit" class="w-full bg-rose-500 text-white font-semibold py-2.5 px-5 rounded-full shadow-sm shadow-rose-200/70 hover:bg-rose-600 transition">
                        Замовити
                    </button>
                </form>
            </div>
        </div>
        {% else %}
        <div class="col-span-full text-center bg-rose-50/50 border border-rose-100 rounded-[1.75rem] py-10 px-6">
            <p class="text-stone-500 text-base">За вашим запитом нічого не знайдено.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
