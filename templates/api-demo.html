{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <!-- Заголовок -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800">API Demo</h1>
        <p class="text-sm text-gray-500 mt-1">
            Перегляд записів та додавання нового елемента через API.
        </p>
    </div>

    <!-- Повідомлення про успіх або помилку -->
    <div id="message" class="hidden p-4 rounded-xl text-sm font-semibold text-center border" role="alert"></div>

    <!-- Форма додавання запису -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Додати запис</h2>

        <form id="addForm" class="space-y-4">
            <div>
                <label for="titleInput" class="block text-sm font-medium text-gray-700 mb-1">
                    Назва / Заголовок
                </label>
                <input
                    id="titleInput"
                    name="title"
                    type="text"
                    placeholder="Введіть назву"
                    class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500"
                >
            </div>

            <div>
                <label for="descriptionInput" class="block text-sm font-medium text-gray-700 mb-1">
                    Опис / Текст
                </label>
                <textarea
                    id="descriptionInput"
                    name="description"
                    rows="3"
                    placeholder="Введіть опис"
                    class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500"
                ></textarea>
            </div>

            <button
                type="submit"
                class="bg-teal-700 hover:bg-teal-800 text-white font-semibold px-5 py-2.5 rounded-xl transition cursor-pointer"
            >
                Додати
            </button>
        </form>
    </div>

    <!-- Список записів -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800">Список записів</h2>
            <span id="loading" class="text-sm font-medium text-teal-700">Завантаження...</span>
        </div>

        <div id="dataList" class="space-y-3"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/api-demo.js') }}"></script>
{% endblock %}
