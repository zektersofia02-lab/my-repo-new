{% extends "base.html" %}

{% block title %}Каталог API — Web Studio{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-4 sm:py-6 space-y-8">
    <!-- Заголовок -->
    <div class="bg-gradient-to-br from-rose-100/80 via-pink-50 to-white p-6 sm:p-8 rounded-[2rem] shadow-sm border border-rose-200/80">
        <span class="inline-flex items-center gap-2 bg-white/90 text-rose-700 border border-rose-200 text-xs font-semibold uppercase tracking-wider px-3.5 py-1 rounded-full mb-3">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span>
            REST API
        </span>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-stone-900">Каталог API</h1>
        <p class="text-sm sm:text-base text-stone-600 mt-1.5">
            Перегляд послуг і товарів та додавання нових записів через API.
        </p>
    </div>

    <!-- Повідомлення про успіх або помилку -->
    <div id="message" class="hidden px-5 py-3.5 rounded-2xl text-sm font-semibold text-center border shadow-xs" role="alert"></div>

    <!-- Форма додавання товару/послуги -->
    <div class="bg-white p-6 sm:p-8 rounded-[1.75rem] shadow-xs border border-rose-100">
        <h2 class="text-lg sm:text-xl font-bold text-stone-900 mb-5">Додати запис</h2>

        <form id="addForm" class="space-y-4">
            <div>
                <label for="titleInput" class="block text-sm font-medium text-stone-700 mb-1.5">
                    Назва послуги / товару
                </label>
                <input
                    id="titleInput"
                    name="title"
                    type="text"
                    required
                    placeholder="Наприклад: Розробка сайту"
                    class="w-full px-4 py-2.5 bg-white rounded-2xl border border-rose-200 text-stone-800 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-rose-400 transition"
                >
            </div>

            <div>
                <label for="priceInput" class="block text-sm font-medium text-stone-700 mb-1.5">
                    Ціна
                </label>
                <input
                    id="priceInput"
                    name="price"
                    type="number"
                    step="any"
                    min="0"
                    required
                    placeholder="Введіть ціну"
                    class="w-full px-4 py-2.5 bg-white rounded-2xl border border-rose-200 text-stone-800 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-rose-400 transition"
                >
            </div>

            <div>
                <label for="descriptionInput" class="block text-sm font-medium text-stone-700 mb-1.5">
                    Опис
                </label>
                <textarea
                    id="descriptionInput"
                    name="description"
                    rows="3"
                    placeholder="Введіть опис"
                    class="w-full px-4 py-2.5 bg-white rounded-2xl border border-rose-200 text-stone-800 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-rose-400 transition"
                ></textarea>
            </div>

            <button
                type="submit"
                class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-7 py-2.5 rounded-full shadow-md shadow-rose-200/80 transition cursor-pointer"
            >
                Додати
            </button>
        </form>
    </div>

    <!-- Список записів -->
    <div class="bg-rose-50/40 p-6 sm:p-8 rounded-[1.75rem] shadow-xs border border-rose-100">
        <div class="flex items-center justify-between gap-3 mb-5">
            <h2 class="text-lg sm:text-xl font-bold text-stone-900">Список записів</h2>
            <span id="loading" class="text-sm font-semibold text-rose-600 bg-rose-100/80 border border-rose-200/70 px-3 py-1 rounded-full">Завантаження...</span>
        </div>

        <div id="dataList" class="space-y-3"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='api-demo.js') }}"></script>
{% endblock %}
