<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Проєкт</title>
    <!-- Підключення Tailwind CSS через CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-screen flex flex-col bg-gray-50">

    <!-- Навігація -->
    <nav class="bg-blue-600 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="#" class="font-bold text-xl tracking-wide">Мій Проєкт</a>
            <div class="space-x-6 flex items-center">
                <a href="{{ url_for('index') }}" class="hover:text-blue-200 transition">Головна</a>
                <a href="{{ url_for('services') }}" class="hover:text-blue-200 transition">Послуги</a>
                <div class="space-x-6 flex items-center">
    <a href="{{ url_for('contact') }}" class="hover:text-blue-200 transition">Контакти</a>
</div>
            </div>
        </div>
    </nav>

    <!-- Основний контент сторінок -->
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 WebStudio. Всі права захищені.</p>
    </footer>

</body>
</html>
